version: '3.8'

# Cap each container's json-file log: 10 MB x 3 files (30 MB max). Without this,
# logs grow unbounded until the next deploy recreates the container. See #460.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: nginx_gateway
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro   # tracked in git; validated by the deploy before recreate
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - webapp
      - api
    networks:
      - web
      - internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

  webapp:
    image: ghcr.io/lfariabr/luisfaria.dev/frontend:latest # ← CHANGED FROM `build:`
    container_name: frontend_app
    logging: *default-logging
    environment:
      - NEXT_PUBLIC_GRAPHQL_URL=https://luisfaria.dev/graphql
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    networks:
      - web
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  api:
    image: ghcr.io/lfariabr/luisfaria.dev/backend:latest # ← CHANGED FROM `build:`
    container_name: backend_api
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-claude-haiku-5-5}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NASA_API_KEY=${NASA_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_COFFEE_PRICE_ID=${STRIPE_COFFEE_PRICE_ID}
      - STRIPE_MEETING_PRICE_ID=${STRIPE_MEETING_PRICE_ID}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - CAL_MEETING_URL=${CAL_MEETING_URL:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://luisfaria.dev}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - GEOCODING_API_KEY=${GEOCODING_API_KEY}
      - RELATIONSHIP_HOME_LAT=${RELATIONSHIP_HOME_LAT}
      - RELATIONSHIP_HOME_LNG=${RELATIONSHIP_HOME_LNG}
      - RELATIONSHIP_HOME_LABEL=${RELATIONSHIP_HOME_LABEL:-Home base}
    # No published port: nginx reaches backend_api:4000 over the compose network.
    # Publishing it bypassed nginx and ufw (Docker ports skip ufw), see #453.
    # Data lives in MongoDB Atlas (MONGODB_URI). There is no local database: the
    # unused mongo:4.4 container was removed in #444.
    depends_on:
      - cache
    networks:
      - internal
      - egress
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 192M

  cache:
    image: redis:alpine
    container_name: redis_cache
    logging: *default-logging
    volumes:
      - redis-data:/data
    networks:
      - internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

volumes:
  redis-data:

# Network isolation (#476, from #40). Only nginx joins both sides.
#   web:      nginx + frontend. Published ports live here; the frontend's SSR
#             calls https://luisfaria.dev/graphql through it, like any visitor.
#   internal: nginx + backend + redis. No route out, and the frontend isn't on
#             it, so it can't reach backend_api:4000 or Redis directly.
#   egress:   backend only, for MongoDB Atlas, Stripe, Anthropic and the other APIs.
networks:
  web:
  internal:
    internal: true
  egress:
