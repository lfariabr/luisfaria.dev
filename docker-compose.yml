version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: nginx_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - webapp
      - api
    networks:
      - app-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

  webapp:
    image: ghcr.io/lfariabr/luisfaria.dev/frontend:latest # ← CHANGED FROM `build:`
    container_name: frontend_app
    environment:
      - NEXT_PUBLIC_GRAPHQL_URL=https://luisfaria.dev/graphql
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    networks:
      - app-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  api:
    image: ghcr.io/lfariabr/luisfaria.dev/backend:latest # ← CHANGED FROM `build:`
    container_name: backend_api
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - RATE_LIMIT_ANONYMOUS_REQUESTS=${RATE_LIMIT_ANONYMOUS_REQUESTS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NASA_API_KEY=${NASA_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_COFFEE_PRICE_ID=${STRIPE_COFFEE_PRICE_ID}
      - STRIPE_MEETING_PRICE_ID=${STRIPE_MEETING_PRICE_ID}
      - FRONTEND_URL=${FRONTEND_URL:-https://luisfaria.dev}
    ports:
      - "4000:4000"
    depends_on:
      - db
      - cache
    networks:
      - app-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 192M

  db:
    image: mongo:4.4
    container_name: mongodb_db
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M

  cache:
    image: redis:alpine
    container_name: redis_cache
    volumes:
      - redis-data:/data
    networks:
      - app-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

volumes:
  mongodb-data:
  redis-data:

networks:
  app-net: