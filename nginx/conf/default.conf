# Production nginx config for luisfaria.dev, mounted read-only at /etc/nginx/conf.d.
# The deploy validates it with `nginx -t` before recreating the containers, and CI
# validates it on every PR (ops/nginx/test-config.sh).

# ---------------------------------------------------------------------------
# TLS, shared by every server below (http context)
# ---------------------------------------------------------------------------
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# ---------------------------------------------------------------------------
# Compression (http context). Next.js already gzips its HTML and static files,
# and nginx leaves responses that arrive compressed alone; this covers the rest,
# mainly /graphql JSON, which Express sends uncompressed.
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/json application/graphql-response+json text/plain text/css application/javascript image/svg+xml;

# ---------------------------------------------------------------------------
# Catch-all: bare-IP and unknown-host requests get nothing
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenge, everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name luisfaria.dev www.luisfaria.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://luisfaria.dev$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www to apex
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.luisfaria.dev;
    ssl_certificate /etc/letsencrypt/live/luisfaria.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luisfaria.dev/privkey.pem;
    return 301 https://luisfaria.dev$request_uri;
}

# ---------------------------------------------------------------------------
# luisfaria.dev
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name luisfaria.dev;
    ssl_certificate /etc/letsencrypt/live/luisfaria.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luisfaria.dev/privkey.pem;

    # Security headers. A location that sets its own add_header drops all of these.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://maps.googleapis.com https://maps.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://maps.gstatic.com; connect-src 'self' data: https://luisfaria.dev https://challenges.cloudflare.com https://maps.googleapis.com https://places.googleapis.com https://maps.gstatic.com https://www.gstatic.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';" always;

    # CORS is Express's job (cors() in backend/src/index.ts), preflight included.
    # Setting it here too sent two Access-Control-Allow-Origin headers (#456).

    # Proxy defaults, set once here. A location that sets any proxy_set_header
    # loses all of these, so locations below set none.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;

    location / {
        proxy_pass http://frontend_app:3000;
        proxy_read_timeout 90;
    }

    # Backend health: /health, /health/ready, /health/details (403 unless trusted)
    location = /health {
        proxy_pass http://backend_api:4000;
        proxy_read_timeout 10;
    }

    location /health/ {
        proxy_pass http://backend_api:4000;
        proxy_read_timeout 10;
    }

    location /webhooks/ {
        proxy_pass http://backend_api:4000;
        proxy_read_timeout 30;
    }

    location /graphql {
        proxy_pass http://backend_api:4000/graphql;
        proxy_read_timeout 90;
    }

    # Scanner paths. Anchored, so slugs like "foo.github.io" still reach the app.
    # Hidden files and dirs (/.env, /.git/config, ...), except /.well-known
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Server-side script extensions and WordPress paths: nothing here runs them
    location ~* (\.(php|aspx?|jsp|cgi)$|^/wp-(admin|login|content|includes)) {
        return 404;
    }
}
