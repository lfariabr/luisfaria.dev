name: CI Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '_docs/**'
      - '*.md'
      - 'copilot-instructions.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '_docs/**'
      - '*.md'
      - 'copilot-instructions.md'
      - 'LICENSE'
      - '.gitignore'

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Backend Tests
  # ============================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-6.0.14

      - name: Install dependencies
        run: npm ci
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

      - name: Build & Type Check
        run: npm run build

      - name: Wait for MongoDB & Redis
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1 && (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; then
              echo "MongoDB and Redis are reachable"
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "MongoDB/Redis not reachable in time"
          exit 1

      - name: Run tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          PORT: 4000
          JWT_SECRET: test-secret-for-ci
          MONGODB_URI: mongodb://localhost:27017/test
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test-openai-key
          RATE_LIMIT_WINDOW: 3600
          RATE_LIMIT_MAX_REQUESTS: 5
          RATE_LIMIT_ANONYMOUS_REQUESTS: 5
          RESEND_API_KEY: test-resend-key
          NASA_API_KEY: test-nasa-key

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  # ============================================
  # Frontend Tests
  # ============================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --force
        # --force needed for React 19 peer dependency resolution

      - name: Run linting
        run: npm run lint || true
        # TODO: Fix eslint-config-next version mismatch, then remove '|| true'

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # ============================================
  # Build Verification
  # ============================================
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build
        env:
          MONGOMS_SYSTEM_BINARY: /usr/bin/mongod

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci --force
          npm run build
        env:
          NEXT_PUBLIC_GRAPHQL_URL: /graphql

      - name: Build Success
        run: echo "✅ All builds completed successfully!"

  # ============================================
  # SEO Audit Gate
  # ============================================
  seo-audit:
    name: SEO Audit Gate
    runs-on: ubuntu-latest
    needs: [build-check]
    if: github.event_name == 'push'
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'

      - name: Run SEO audit
        working-directory: backend
        run: npx ts-node scripts/seo-audit.ts

  # ============================================
  # Docker Image Build & Push to GHCR
  # ============================================
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # Only build images on pushes to main/master (not PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GRAPHQL_URL=https://luisfaria.dev/graphql
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Docker Build Success
        run: |
          echo "✅ Docker images built and pushed to GHCR!"
          echo "Backend tags: ${{ steps.meta-backend.outputs.tags }}"
          echo "Frontend tags: ${{ steps.meta-frontend.outputs.tags }}"

      - name: Cleanup old backend images (keep last 5)
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ github.event.repository.name }}/backend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Cleanup old frontend images (keep last 5)
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ github.event.repository.name }}/frontend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

  # ============================================
  # Deploy to Production
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 5m  # ← Reduced from 10m (should finish in ~1 min)
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            cd /var/www/portfolio
            
            # Save rollback point
            ROLLBACK_DIR="/var/lib/deploy-rollback"
            mkdir -p $ROLLBACK_DIR
            git rev-parse HEAD > $ROLLBACK_DIR/commit.txt 2>/dev/null || echo "none" > $ROLLBACK_DIR/commit.txt
            
            # Pull latest docker-compose.yml (only file that matters now)
            echo "📥 Pulling latest configuration..."
            git fetch --prune origin
            git reset --hard origin/master
            
            # Login to GHCR (to pull private images)
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            
            # Pull pre-built images (FAST! No building!)
            echo "📦 Pulling latest images from GHCR..."
            docker compose pull
            
            # Restart with new images
            echo "🔄 Restarting containers..."
            docker compose up -d --force-recreate --remove-orphans
            
            # Cleanup
            docker image prune -f
            
            echo "✅ Deployment complete!"

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "🔍 Verifying deployment..."
            cd /var/www/portfolio
            git config --global --add safe.directory /var/www/portfolio
            
            # Wait for services to start
            sleep 15
            
            # Show container status
            docker compose ps
            
            # Check all required services
            REQUIRED_SERVICES="nginx_gateway frontend_app backend_api mongodb_db redis_cache"
            FAILED=0
            
            for SERVICE in $REQUIRED_SERVICES; do
              if docker ps --format '{{.Names}}' | grep -q "$SERVICE"; then
                echo "✅ $SERVICE is running"
              else
                echo "❌ $SERVICE is NOT running"
                FAILED=1
              fi
            done
            
            # Frontend health check
            echo "Testing frontend..."
            if curl -s https://luisfaria.dev | grep -q "title"; then
              echo "✅ Frontend health check passed"
            else
              echo "❌ Frontend health check failed"
              FAILED=1
            fi
            
            # Backend deep health check (verifies MongoDB + Redis connectivity)
            # Uses /health/details (IP-whitelisted, trusted from Docker network)
            echo "Testing backend API (deep health check)..."
            HEALTH_RESPONSE=$(docker exec nginx_gateway curl -sf "http://backend_api:4000/health/details" 2>/dev/null || echo "FAIL")
            if echo "$HEALTH_RESPONSE" | grep -q '"status":"ok"'; then
              echo "✅ Backend deep health check passed"
              echo "$HEALTH_RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$HEALTH_RESPONSE"
            else
              echo "❌ Backend deep health check failed"
              echo "$HEALTH_RESPONSE"
              FAILED=1
            fi
            
            # Handle failures with automatic rollback
            if [ $FAILED -eq 1 ]; then
              echo "❌ Health checks failed! Attempting rollback..."
              
              ROLLBACK_DIR="/var/lib/deploy-rollback"
              PREV_COMMIT=$(cat $ROLLBACK_DIR/commit.txt 2>/dev/null || echo "")
              
              if [ -n "$PREV_COMMIT" ]; then
                echo "🔄 Rolling back to commit: $PREV_COMMIT"
                git reset --hard $PREV_COMMIT
                docker compose down
                docker compose build
                docker compose up -d --force-recreate --remove-orphans
                
                sleep 15
                echo "Verifying rollback..."
                docker compose ps
              else
                echo "❌ No rollback state found."
              fi
              
              exit 1
            fi
            
            # Success! Show logs
            echo "📝 Recent API logs:"
            docker compose logs --tail=20 api
            
            echo "✅ All health checks passed!"

      - name: Notify Discord - Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: "✅ Deploy Successful"
          description: |
            **Commit:** `${{ github.sha }}`
            **Author:** ${{ github.actor }}
            **Message:** ${{ github.event.head_commit.message }}
          color: 0x00ff00

      - name: Notify Discord - Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: "❌ Deploy Failed"
          description: |
            **Commit:** `${{ github.sha }}`
            **Author:** ${{ github.actor }}
            **Message:** ${{ github.event.head_commit.message }}
            
            Check GitHub Actions for details.
          color: 0xff0000
