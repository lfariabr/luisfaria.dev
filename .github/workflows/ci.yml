name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Backend Tests
  # ============================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build & Type Check
        run: npm run build

      - name: Wait for MongoDB & Redis
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1 && (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1; then
              echo "MongoDB and Redis are reachable"
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done
          echo "MongoDB/Redis not reachable in time"
          exit 1

      - name: Run tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          PORT: 4000
          JWT_SECRET: test-secret-for-ci
          MONGODB_URI: mongodb://localhost:27017/test
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: test-openai-key
          RATE_LIMIT_WINDOW: 3600
          RATE_LIMIT_MAX_REQUESTS: 5
          RATE_LIMIT_ANONYMOUS_REQUESTS: 5
          RESEND_API_KEY: test-resend-key
          NASA_API_KEY: test-nasa-key

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  # ============================================
  # Frontend Tests
  # ============================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --force
        # --force needed for React 19 peer dependency resolution

      - name: Run linting
        run: npm run lint || true
        # TODO: Fix eslint-config-next version mismatch, then remove '|| true'

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # ============================================
  # Build Verification
  # ============================================
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci --force
          npm run build
        env:
          NEXT_PUBLIC_GRAPHQL_URL: /graphql

      - name: Build Success
        run: echo "✅ All builds completed successfully!"

  # ============================================
  # Docker Image Build & Push to GHCR
  # ============================================
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # Only build images on pushes to main/master (not PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GRAPHQL_URL=https://luisfaria.dev/graphql

      - name: Docker Build Success
        run: |
          echo "✅ Docker images built and pushed to GHCR!"
          echo "Backend tags: ${{ steps.meta-backend.outputs.tags }}"
          echo "Frontend tags: ${{ steps.meta-frontend.outputs.tags }}"

      - name: Cleanup old backend images (keep last 5)
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ github.repository }}/backend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: true

      - name: Cleanup old frontend images (keep last 5)
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ github.repository }}/frontend'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: true

  # ============================================
  # Deploy to Production
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Only deploy on pushes to main/master (not PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: prod
    
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd /var/www/luisfaria || cd ~/luisfaria || { echo "Project directory not found"; exit 1; }
            
            # Save current state for rollback (persistent storage)
            echo "📦 Saving current state for rollback..."
            ROLLBACK_DIR="/var/lib/deploy-rollback"
            sudo mkdir -p $ROLLBACK_DIR
            sudo chown $(whoami):$(whoami) $ROLLBACK_DIR
            
            # Save image digests using image inspection (not container)
            BACKEND_IMG=$(docker compose config --images 2>/dev/null | grep backend || echo "")
            FRONTEND_IMG=$(docker compose config --images 2>/dev/null | grep frontend || echo "")
            if [ -n "$BACKEND_IMG" ]; then
              docker image inspect --format='{{index .RepoDigests 0}}' "$BACKEND_IMG" 2>/dev/null > $ROLLBACK_DIR/backend.txt || echo "" > $ROLLBACK_DIR/backend.txt
            fi
            if [ -n "$FRONTEND_IMG" ]; then
              docker image inspect --format='{{index .RepoDigests 0}}' "$FRONTEND_IMG" 2>/dev/null > $ROLLBACK_DIR/frontend.txt || echo "" > $ROLLBACK_DIR/frontend.txt
            fi
            git rev-parse HEAD > $ROLLBACK_DIR/commit.txt
            echo "Rollback state saved to $ROLLBACK_DIR"
            
            # Fetch and reset to exact remote state (idempotent)
            git fetch --prune origin
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              DEPLOY_REF="origin/main"
            else
              DEPLOY_REF="origin/master"
            fi
            echo "Deploying from $DEPLOY_REF"
            git reset --hard $DEPLOY_REF
            git clean -fdx -e .env -e node_modules
            
            # Login to GHCR with dedicated read-only token (suppress output to prevent token leakage)
            if ! printf '%s' "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ vars.GHCR_USER }}" --password-stdin >/dev/null 2>&1; then
              echo "❌ GHCR login failed"
              exit 1
            fi
            echo "✅ GHCR login successful"
            
            # Pull new images
            docker compose pull
            
            # Restart containers (minimal-downtime single-instance redeploy)
            docker compose up -d --remove-orphans
            
            # Clean up old images
            docker image prune -f
            
            echo "✅ Deployment complete!"

      - name: Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "🔍 Checking container health..."
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            # Wait for containers to stabilize
            sleep 10
            
            # Validate each required service is running
            REQUIRED_SERVICES="nginx_gateway frontend_app backend_api mongodb_db redis_cache"
            FAILED=0
            
            for SERVICE in $REQUIRED_SERVICES; do
              STATUS=$(docker inspect --format='{{.State.Status}}' "$SERVICE" 2>/dev/null || echo "not_found")
              HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no_healthcheck{{end}}' "$SERVICE" 2>/dev/null || echo "unknown")
              
              if [ "$STATUS" = "running" ]; then
                if [ "$HEALTH" = "healthy" ] || [ "$HEALTH" = "no_healthcheck" ]; then
                  echo "✅ $SERVICE is running (health: $HEALTH)"
                else
                  echo "⚠️ $SERVICE is running but health: $HEALTH"
                  FAILED=1
                fi
              else
                echo "❌ $SERVICE status: $STATUS"
                FAILED=1
              fi
            done
            
            if [ $FAILED -eq 1 ]; then
              echo "❌ One or more services failed health check!"
              docker ps -a
              
              # Auto-rollback using saved image digests
              echo "🔄 Attempting automatic rollback..."
              cd /var/www/luisfaria || cd ~/luisfaria || exit 1
              
              ROLLBACK_DIR="/var/lib/deploy-rollback"
              PREV_COMMIT=$(cat $ROLLBACK_DIR/commit.txt 2>/dev/null || echo "")
              BACKEND_DIGEST=$(cat $ROLLBACK_DIR/backend.txt 2>/dev/null || echo "")
              FRONTEND_DIGEST=$(cat $ROLLBACK_DIR/frontend.txt 2>/dev/null || echo "")
              
              if [ -n "$PREV_COMMIT" ]; then
                echo "Rolling back to commit: $PREV_COMMIT"
                git reset --hard $PREV_COMMIT
                
                # Pull specific image digests if available
                if [ -n "$BACKEND_DIGEST" ]; then
                  echo "Pulling backend: $BACKEND_DIGEST"
                  docker pull "$BACKEND_DIGEST" || true
                fi
                if [ -n "$FRONTEND_DIGEST" ]; then
                  echo "Pulling frontend: $FRONTEND_DIGEST"
                  docker pull "$FRONTEND_DIGEST" || true
                fi
                
                docker compose up -d --remove-orphans
                
                # Verify rollback
                sleep 5
                ROLLBACK_OK=1
                for SERVICE in backend_api frontend_app; do
                  if ! docker ps --format '{{.Names}}' | grep -q "$SERVICE"; then
                    ROLLBACK_OK=0
                  fi
                done
                
                if [ $ROLLBACK_OK -eq 1 ]; then
                  echo "⚠️ Rollback completed. Services restored to previous version."
                else
                  echo "❌ Rollback failed! Manual intervention required."
                fi
              else
                echo "❌ No rollback state found at $ROLLBACK_DIR. Manual intervention required."
              fi
              
              exit 1
            fi
            
            echo "✅ All services are running!"
            echo "💾 Rollback state preserved at /var/lib/deploy-rollback for manual recovery if needed."
